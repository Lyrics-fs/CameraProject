/** Level1 `/upload-table` 与云函数 `LAB_SECRET` / app.py 校验一致；值见 README「实验室上传密钥」；来自 local.properties 或 `-PLAB_UPLOAD_SECRET=`，勿提交密钥。 */
String readLabUploadSecretForBuildConfig(Project proj) {
    def props = new Properties()
    def f = proj.rootProject.file("local.properties")
    if (f.exists()) {
        f.withInputStream { props.load(it) }
    }
    def fromFile = props.getProperty("LAB_UPLOAD_SECRET", "")?.trim()
    if (fromFile) {
        return fromFile
    }
    def fromProp = proj.findProperty("LAB_UPLOAD_SECRET")
    return fromProp != null ? fromProp.toString().trim() : ""
}

android {
    namespace 'com.example.camera'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.camera"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        // 标定数据上传 API 根地址（末尾保留 /）；若已改用 Supabase 可忽略
        buildConfigField "String", "CALIBRATION_API_BASE_URL", "\"https://calibration-api-jvbdiusqed.cn-hangzhou.fcapp.run/\""
        // Supabase：在控制台复制 Project URL 与 anon public key
        buildConfigField "String", "SUPABASE_URL", "\"https://YOUR_PROJECT_REF.supabase.co\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"YOUR_SUPABASE_ANON_KEY\""

        def rawLabSecret = readLabUploadSecretForBuildConfig(project)
        def escLabSecret = rawLabSecret
                .replace("\\", "\\\\")
                .replace("\"", "\\\"")
        buildConfigField "String", "LAB_UPLOAD_SECRET", "\"${escLabSecret}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = "11"
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
}

